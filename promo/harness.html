<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kura 캡처 하네스</title>
  <!--
    홍보 캡처용 하네스 (개발 81). 실제 앱 프론트(src/main.tsx)를 그대로 띄우고 백엔드만 가짜로 대신한다.
    `npm run dev` 뒤 http://localhost:1420/promo/harness.html?scene=approval|wallet 로 연다.
    값은 실제 Base 메인넷 내역(개발 78·80 의 Exa·AiSpace 결제)을 옮겨 적은 것이다 — 지어낸 거래를 넣지 말 것.
    배포 빌드에는 안 들어간다(vite build 의 입력은 루트 index.html 뿐).
  -->
  <style>
    html, body { margin: 0; background: #E9E9E6; }
    #root { width: 100vw; overflow: hidden; background: #FAFAF9; }
  </style>
  <script>
    // ?card=1 — 승인 창 카드만 뽑을 때. 뒤를 어둡게 덮는 막을 걷어 카드 모서리 밖이 앱 바탕색이 되게 한다.
    if (new URLSearchParams(location.search).get("card")) {
      document.write('<style>.fixed.inset-0{background:transparent!important;backdrop-filter:none!important}</style>');
    }
  </script>
  <script>
    const scene = new URLSearchParams(location.search).get("scene") || "wallet";
    const now = Math.floor(Date.now() / 1000);
    const ME = "0x8b7ba5077d261739f5FeBB31B10167671e590161";
    const AISPACE = "0xA7f3Ad0E69F61864092FAbBa6Cee00AF6e584689";
    const EXA = "0x6d6E695b09861467c7d462f5AAF31cF3540B9192";

    // get_history 실응답(10-14·10-25)에서 옮김. ts 만 「오늘」 기준으로 당겨 상대 시각이 자연스럽게 보이게 했다.
    const real = [
      [AISPACE, "0.045", "settled", "0x14b17dd13112912305177253f628315487eb446af77a4ea2aaad4a3c13f95cf7"],
      [AISPACE, "0.045", "settled", "0x69d6a31ba1bc88bf40dc5204f0b9e4687ab58e3d79175a0cb3f56c0387e2b863"],
      [AISPACE, "0.045", "settled", "0x398cde570de961946d9d0550f8e566b0b9f5d694f48b85bdd47c3b386b7c51b0"],
      [AISPACE, "0.045", "failed", ""],
      [AISPACE, "0.045", "settled", "0x28d7d3356c4ff29ab1a57193993ec80f7667f3e0822e78e6e74229c00213f609"],
      [AISPACE, "0.045", "settled", "0x70c4e65bc8d94cd0424dc644a399a7b0bd9dedf25d22e231d2c6578f2efe8c45"],
      [AISPACE, "0.045", "settled", "0xbec3a530f1250956555f608b075d9766f95fcc13c66daa212781642a179d5a2e"],
      [AISPACE, "0.015", "settled", "0xd5f8127fe473aa3b2bcf3f264f9866a2a846cdef8e65f61f79f1b2626b1d5737"],
      [AISPACE, "0.015", "settled", "0x12fcc74b36d8ff869e1c9ba9ae8e5d935afcbc28c5b38662e5b2ad5997458802"],
      [EXA, "0.007", "settled", "0x50e8e0ecd1f0bd8c255224d50ecfda0e737fe84472ba9cd78ebbeb84a540ba10"],
    ];
    const history = real.map(([to, amount, status, settle], i) => ({
      ts: now - 90 - i * 41,
      token: "USDC",
      to,
      amount,
      status,
      detail: status === "failed" ? "비밀번호가 올바르지 않습니다" : "0x" + "0".repeat(64),
      settle_tx: settle,
    }));

    const request = {
      id: "promo-1",
      token: "USDC",
      to: AISPACE,
      amount: "0.045",
      memo: "매거진 표지 사진 한 장 (flux-2-max, 4:5)",
      created: now - 12,
      kind: "x402",
      resource: "https://x402.aispace.bot/api/v1/image/generate",
      chain_id: 8453,
      account: 0,
      from: ME,
    };

    const settings = {
      single_usdc: "0.5", daily_usdc: "1", single_eth: "0.001", daily_eth: "0.002",
      auto_approve_usdc: "0", auto_lock_mins: "15", rpc_url: "", lock_on_blur: false,
      notify_auto: true, notify_hide_amount: false, auto_trusted_only: true,
      chain_id: 8453, agent_lookup: true, auto_check_update: false,
    };

    const replies = {
      get_wallet_status: { state: "encrypted", address: ME, backed_up: true, accounts: [{ index: 0, address: ME, label: "" }], active: 0 },
      get_balances: { eth: "0", usdc: "2.631" },
      get_settings: settings,
      get_lang: "ko",
      get_history: history,
      get_today_spend: { usdc: "0.135", eth: "0" },
      get_pending_request: scene === "approval" ? request : null,
      session_status: { unlocked: false, remaining_secs: 0, auto_limit: "0" },
      get_agent_status: { connected: true, client: "Claude Code" },
      is_trusted_addr: true,
      recent_same_payment_secs: null,
      is_locked: false,
      settings_file_broken: false,
      get_autostart: true,
      get_trusted_addrs: [AISPACE, EXA],
      check_update: null,
    };

    let cb = 0;
    window.__TAURI_INTERNALS__ = {
      metadata: { currentWindow: { label: "main" }, currentWebview: { windowLabel: "main", label: "main" } },
      transformCallback: (fn) => { const id = ++cb; window["_" + id] = fn; return id; },
      unregisterCallback: () => {},
      convertFileSrc: (p) => p,
      invoke: async (cmd, args) => {
        if (cmd.startsWith("plugin:")) return cmd.endsWith("|listen") ? ++cb : null;
        if (cmd in replies) return structuredClone(replies[cmd]);
        return null;
      },
    };
    window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} };
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
