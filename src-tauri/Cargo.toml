[package]
name = "kura"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon = 메뉴바 상주(개발 26), image-png = 트레이 아이콘을 PNG 로 싣기,
# macos-private-api = 투명 창(팝오버 둥근 모서리). App Store 심사에선 막히는 옵션이지만
# 크립토 지갑은 어차피 심사 3.1.5(조직 계정 필수)로 못 올려 DMG/Homebrew 배포라 무관.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
# 로그인 시 자동 시작 (상시 구동 — Session 18)
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy = { version = "2.0.5", features = [
    "signer-local",
    "signer-mnemonic",
    "network",
    "rpc-types",
] }
dirs = "6.0.0"
rand = "0.8"
# 키 암호화 (비번 → 키 유도 + AES-256-GCM)
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
zeroize = "1"
# 잔액 조회 등에서 여러 RPC 호출을 동시에 (try_join! 매크로) + 일일 한도 장부 직렬화(sync::Mutex)
tokio = { version = "1.52.3", features = ["macros", "sync"] }
# statfs 로 볼륨이 읽기 전용(DMG 마운트)인지 판별 (connect — 코덱스 개발38 1차)
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

# 인앱 자동 업데이트 (개발 31). 데스크톱 전용 — 모바일 타깃엔 안 들어간다.
#
# ⚠️ 지갑에서 자동 업데이트는 **두 번째 신뢰 뿌리**다. 업데이트 서명 개인키를 쥔 쪽은
# 임의 코드를 이 앱으로 밀어넣을 수 있고, 그 코드는 ~/.jigap/wallet.enc 를 읽을 수 있다.
# 그래서 (1) 서명 검증은 플러그인이 강제하고(minisign, 끌 수 없음),
# (2) **조용한 설치는 하지 않는다** — 버전·릴리스 노트를 띄우고 사람이 눌러야 설치된다,
# (3) 승인 대기 중인 결제가 있으면 재시작을 막는다(update.rs).
# 자세한 근거는 SECURITY.md "업데이트" 절.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"

