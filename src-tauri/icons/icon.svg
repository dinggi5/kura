<!-- 앱 아이콘 정본 (개발 41) — 열쇠구멍 동전: 아이보리 스퀘어클 + 토스블루 동전 +
     뚫린 열쇠구멍(바탕 그라데이션이 그대로 비친다).
     개발 39 의 곳간(蔵) 모티프는 폐기했다 — 윤곽선 + 아이보리 위 먹선이라 축소하면 획이
     붙고 카메라로 읽혔다. 이번 원칙은 "채운 덩어리 하나 + 강한 대비": 동전 색면이 곧
     형태라서 32px·어두운 바탕에서도 안 죽는다(개발 41 Dock 실측 비교).
     열쇠구멍은 색을 덧칠하지 않고 마스크로 뚫는다 — 바탕이 그라데이션이라 덧칠하면
     경계에서 어긋난다.
     트레이 아이콘(tray-normal.svg)은 같은 열쇠구멍 모티프의 메뉴바판이다. 하나를 고치면
     둘 다 고친다.
     수정 시: rsvg-convert -w 1024 -h 1024 로 PNG 뽑아 `npx tauri icon` → android/·ios/
     산출물 삭제 → docs/icon.png 를 cmp 로 동기화(publish-registry.sh 가 검사한다). -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFBF6"/>
      <stop offset="1" stop-color="#EFEDE4"/>
    </linearGradient>
    <!-- 열쇠구멍: 흰=남기고 검=뚫는다 -->
    <mask id="keyhole">
      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
      <circle cx="512" cy="456" r="64" fill="#000000"/>
      <path d="M 512 456 L 440 646 L 584 646 Z" fill="#000000"/>
    </mask>
  </defs>
  <!-- macOS Big Sur 규격: 1024 캔버스에 824 스퀘어클, 여백 100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#1A1814" stroke-opacity="0.06" stroke-width="4"/>
  <!-- 동전 (accent) -->
  <circle cx="512" cy="512" r="242" fill="#3182F6" mask="url(#keyhole)"/>
</svg>
